<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Object preview · PA Policy Forge</title><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"></head><body><main class="content" style="margin:auto"><div class="page-header"><div><p class="eyebrow">{{profile.name}} · SCM candidate</p><h1>Preview {{object_label}}</h1></div></div><div class="card"><div class="card-header"><div><h2>{{payload.name}}</h2><p class="muted">Controleer het object vóór het naar de candidate-configuratie wordt geschreven.</p></div></div><div class="table-wrap"><table><thead><tr><th>Veld</th><th>Waarde</th></tr></thead><tbody>{% for key,value in payload.items() if key not in ['folder','snippet','device'] %}<tr><td>{{key}}</td><td class="mono">{{value}}</td></tr>{% endfor %}</tbody></table></div><div class="cluster" style="justify-content:flex-end;margin-top:18px"><a class="btn" href="{{url_for('index',policy_profile=profile.id,policy_view='objects',object_type=object_type)}}#policy-management">Annuleren</a><form method="post" action="{{url_for('object_push',draft_id=draft_id)}}"><input type="hidden" name="csrf" value="{{csrf_token()}}"><button class="btn btn-primary" type="submit">Push naar candidate</button></form></div></div></main></body></html>
