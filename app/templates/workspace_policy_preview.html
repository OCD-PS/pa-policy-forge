<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Policy preview · PA Policy Forge</title><link rel="icon" href="{{url_for('static',filename='favicon.svg')}}" type="image/svg+xml"><link rel="stylesheet" href="{{url_for('static',filename='app.css')}}"></head><body><main class="content" style="margin:auto"><div class="page-header"><div><p class="eyebrow">{{workspace.name}} · {{draft.scope}}</p><h1>Preview {{draft.policy_name}}</h1></div></div><div class="grid grid-2"><div class="card"><h2>Voor</h2><pre class="xml-preview">{{draft.before._xml}}</pre></div><div class="card"><h2>Na</h2><pre class="xml-preview">{{draft.replacement_xml}}</pre></div></div><div class="card"><div class="callout"><strong>Nieuwe workspaceversie</strong><br>De volledige XML wordt gekopieerd en alleen deze exacte policy-node wordt vervangen. De bronworkspace blijft ongewijzigd.</div><form method="post" action="{{url_for('config_workspace_policy_apply',draft_id=draft_id)}}"><input type="hidden" name="csrf" value="{{csrf_token()}}"><div class="cluster" style="justify-content:flex-end;margin-top:18px"><a class="btn" href="{{url_for('config_workspace_editor',workspace_id=workspace.id,scope=draft.scope,policy_kind=draft.kind,rulebase=draft.rulebase)}}">Annuleren</a><button class="btn btn-primary" type="submit">Bewaar nieuwe versie</button></div></form></div></main></body></html>
