<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inloggen · PA Policy Forge</title><link rel="stylesheet" href="{{ url_for('static',filename='app.css') }}"></head>
<body><main class="login-page"><section class="login-panel"><div class="login-card"><a class="brand" href="/"><span class="brand-mark">PA</span><span class="brand-copy">Policy Forge</span></a><h1>Welkom</h1>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash flash-{{category}}"><div class="flash-body">{{message}}</div></div>{% endfor %}{% endwith %}<form method="post" class="stack"><input type="hidden" name="csrf" value="{{csrf_token()}}"><div class="field"><label for="username">Gebruikersnaam</label><input id="username" name="username" autocomplete="username" required autofocus></div><div class="field"><label for="password">Wachtwoord</label><div class="input-wrap"><input id="password" type="password" name="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="password">Toon</button></div></div><button class="btn btn-primary" type="submit">Inloggen</button></form></div></section><aside class="login-art"><div class="login-art-copy"><p class="eyebrow" style="color:#000">From traffic to control</p></div></aside></main><script src="{{url_for('static',filename='app.js')}}"></script></body></html>
