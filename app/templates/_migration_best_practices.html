<details class="migration-control-card" id="best-practices">
  <summary><span>Best practices en project health</span></summary>
  <div class="migration-control-body">
    <div class="cluster">
      {% if can_edit %}
      <form method="post" action="{{url_for('migration_analysis_run',project_id=project.id)}}">
        <input type="hidden" name="csrf" value="{{csrf_token()}}">
        <button class="btn btn-primary btn-compact" type="submit">Analyse uitvoeren</button>
      </form>
      <form method="post" action="{{url_for('migration_disable_imported',project_id=project.id)}}" data-confirm="Alle geïmporteerde Security- en NAT-regels disabled zetten?">
        <input type="hidden" name="csrf" value="{{csrf_token()}}">
        <button class="btn btn-compact" type="submit">Security en NAT disabled zetten</button>
      </form>
      {% endif %}
    </div>
    <div class="migration-check-list">
      {% for check in best_practices.checks %}
      <article class="is-{{'review' if check.informational|default(false) else 'pass' if check.passed else 'fail'}}">
        <span>{{'i' if check.informational|default(false) else '✓' if check.passed else '!'}}</span>
        <div><strong>{{check.title}}</strong><p>{{check.detail}}{% if check.count %} · {{check.count}}{% endif %}</p></div>
      </article>
      {% endfor %}
    </div>
  </div>
</details>
